name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify native engine and WAV CLI with sanitizers
        run: |
          cmake -S native -B build/native-sanitize -DAC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-sanitize --parallel 2
          ctest --test-dir build/native-sanitize --output-on-failure

      - name: Run verification
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
