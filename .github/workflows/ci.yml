name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          path: accordomi

      - name: Check out Paravoid Android
        uses: actions/checkout@v7
        with:
          repository: lelloman/paravoid-android
          ref: 42d40c85a74bb5d2e5405bc69b385d6e61032c3b
          path: paravoid-android

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify native engine and WAV CLI with sanitizers
        working-directory: accordomi
        run: |
          cmake -S native -B build/native-sanitize -DAC_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native-sanitize --parallel 2
          ctest --test-dir build/native-sanitize --output-on-failure

      - name: Run verification
        working-directory: accordomi
        run: ./gradlew testNormalDebugUnitTest lintNormalDebug assembleNormalDebug assembleNormalDebugAndroidTest --stacktrace

      - name: Verify Paravoid shell packaging
        working-directory: accordomi
        env:
          PARAVOID_SIGNING_KEY: ${{ github.workspace }}/accordomi/app/paravoid/keys/release.der
          PARAVOID_TRUST_POLICY: ${{ github.workspace }}/accordomi/app/paravoid/keys/trust.json
        run: |
          python3 scripts/prepare-paravoid-local.py
          ./gradlew :app:assembleParavoidAndroidDebug --stacktrace
